name: offline_lan_chat
description: A peer-to-peer chat starter for phones on the same local network.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  shared_preferences: ^2.5.3
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  sqflite: ^2.4.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  share_plus: ^10.1.4

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
